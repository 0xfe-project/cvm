name: ci

# The local gate, run by GitHub: format, the freestanding audit, and the test
# suite in all four build configurations (debug, release, asan, tsan).
#
# One platform to start. The OS matrix (Linux, Windows) is deliberately
# deferred: vm/plat.h and vm/threads.c carry the POSIX and Windows branches,
# but only the Darwin ones are exercised day to day, so turning those runners
# on is a porting task of its own and not a CI edit. When it happens, this
# becomes:
#
#   strategy:
#     matrix:
#       os: [macos-14, ubuntu-latest, windows-latest]
#   runs-on: ${{ matrix.os }}
#
# and whatever the audit's "compile-time checked only" branches turn out to
# need. The ccache step below already takes a key that separates the matrix
# entries, which is the part of the matrix that is a CI edit.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # clang-format's output differs between major versions, so the runner has
      # to format with the same major that development does -- Homebrew's
      # formula is the same 23.x that is on the development machine. The fmt
      # step prints the version it used, so a mismatch shows up as a version
      # in the log rather than as a mysterious diff.
      - name: clang-format
        run: brew install clang-format

      # The build uses ccache when it finds it (scripts/lib/toolchain.mjs), and
      # the gate compiles the whole runtime four times -- once per
      # configuration -- so without a cache every run pays for all four from
      # cold. The action installs ccache if the runner has none, caches the
      # directory each platform keeps it in, and keys the cache per job and
      # platform with a timestamp so that a run always saves a fresh entry and
      # always restores from the most recent one. Pinned to a version rather
      # than a moving major: this is the only third-party action the project
      # uses, and "which version ran" should be answerable from the file.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 500M

      # The project has no npm dependencies -- package.json is only a script
      # runner -- so there is nothing to install; the gate is the compiler
      # and the test binaries.
      - name: ci
        run: pnpm run ci

      # Whether the cache is working is the difference between a gate that
      # takes a minute and one that takes three, and it is not visible from a
      # green check. Printed even when the gate fails, because a failing run
      # is where a cold cache costs the most.
      - name: ccache stats
        if: always()
        run: ccache -s
