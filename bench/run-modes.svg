<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 993 520" width="993" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="993" height="520" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="600" fill="#111827">Three modes, because when a collector runs matters as much as how</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">Each scenario runs three times. Measuring only defaults would compare tuning, not design.</text>

  <!-- ============ mode 1: alloc-only ============ -->
  <rect x="40" y="88" width="840" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="114" font-size="14" font-weight="600" fill="#111827">alloc-only</text>
  <text x="160" y="114" font-size="12" fill="#6b7280">— heap reserved large enough that nothing collects</text>

  <!-- timeline -->
  <line x1="60" y1="152" x2="860" y2="152" stroke="#9ca3af"/>
  <text x="60" y="176" font-size="11" fill="#9ca3af">0 allocations</text>
  <text x="812" y="176" font-size="11" fill="#9ca3af">end</text>
  <text x="470" y="176" font-size="11" fill="#374151" text-anchor="middle">no collection marks: this measures the allocator alone</text>
  <text x="60" y="196" font-size="11" fill="#2563eb">bump pointer versus free list versus hash insert — the one number where cvm's design should win by a lot</text>

  <!-- ============ mode 2: fixed-cadence ============ -->
  <rect x="40" y="216" width="840" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="242" font-size="14" font-weight="600" fill="#111827">fixed-cadence</text>
  <text x="196" y="242" font-size="12" fill="#6b7280">— every backend forced to collect at the same allocation count</text>

  <line x1="60" y1="280" x2="860" y2="280" stroke="#9ca3af"/>
  <g stroke="#ef4444" stroke-width="2">
    <line x1="180" y1="270" x2="180" y2="290"/>
    <line x1="300" y1="270" x2="300" y2="290"/>
    <line x1="420" y1="270" x2="420" y2="290"/>
    <line x1="540" y1="270" x2="540" y2="290"/>
    <line x1="660" y1="270" x2="660" y2="290"/>
    <line x1="780" y1="270" x2="780" y2="290"/>
  </g>
  <text x="60" y="306" font-size="11" fill="#9ca3af">0</text>
  <text x="844" y="306" font-size="11" fill="#9ca3af">end</text>
  <text x="180" y="264" font-size="10" fill="#ef4444" text-anchor="middle">collect</text>
  <text x="60" y="324" font-size="11" fill="#2563eb">equal collection count for everyone, so the difference is the mechanism — mark, sweep, root scan — with triggering policy removed</text>

  <!-- ============ mode 3: auto ============ -->
  <rect x="40" y="344" width="840" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="370" font-size="14" font-weight="600" fill="#111827">auto</text>
  <text x="120" y="370" font-size="12" fill="#6b7280">— each collector uses its own default policy</text>

  <line x1="60" y1="408" x2="860" y2="408" stroke="#9ca3af"/>
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="150" y1="398" x2="150" y2="418"/>
    <line x1="260" y1="398" x2="260" y2="418"/>
    <line x1="300" y1="398" x2="300" y2="418"/>
    <line x1="480" y1="398" x2="480" y2="418"/>
    <line x1="620" y1="398" x2="620" y2="418"/>
    <line x1="640" y1="398" x2="640" y2="418"/>
    <line x1="700" y1="398" x2="700" y2="418"/>
  </g>
  <text x="60" y="434" font-size="11" fill="#9ca3af">0</text>
  <text x="844" y="434" font-size="11" fill="#9ca3af">end</text>
  <text x="60" y="452" font-size="11" fill="#2563eb">uneven marks are the point: heap growth and when-to-collect are policy, and this is where a thirty-year-old default beats a fresh one</text>

  <text x="40" y="492" font-size="11" fill="#9ca3af">A backend that cannot be forced to collect on demand — one with no way to say "collect now" — is reported as unable to run that mode, rather than approximated.</text>
</svg>
