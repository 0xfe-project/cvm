<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 560" width="1012" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1012" height="560" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="600" fill="#111827">The trade these four collectors made</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">Design intent from reading each collector's code — not a measurement. Where a collector sits here is a prediction the benchmark will test.</text>

  <!-- plot area -->
  <rect x="120" y="100" width="720" height="340" fill="#fbfbfd" stroke="#e5e7eb"/>

  <!-- the trade band: short pause + taxed store  <->  long pause + free store -->
  <path d="M120 100 L120 200 L840 440 L840 340 Z" fill="#eef2ff" opacity="0.75"/>
  <text x="700" y="132" font-size="12" fill="#6366f1" font-style="italic">the trade this comparison is about</text>

  <!-- axes -->
  <line x1="120" y1="440" x2="840" y2="440" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="120" y2="440" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="480" y="492" font-size="12" fill="#4b5563" text-anchor="middle">short pauses  ←  collection length  →  long pauses</text>
  <text x="104" y="270" font-size="12" fill="#4b5563" text-anchor="middle" transform="rotate(-90 104 270)">free stores  ←  pointer-store cost  →  taxed stores</text>

  <!-- cvm -->
  <circle cx="682" cy="151" r="9" fill="#2563eb"/>
  <line x1="674" y1="145" x2="600" y2="118" stroke="#93c5fd"/>
  <text x="520" y="114" font-size="13" font-weight="600" fill="#1d4ed8">cvm</text>
  <text x="452" y="130" font-size="11" fill="#3b82f6">parallel STW mark, exact roots, no barrier</text>

  <!-- bdwgc -->
  <circle cx="566" cy="141" r="9" fill="#7c3aed"/>
  <line x1="560" y1="136" x2="500" y2="122" stroke="#c4b5fd"/>
  <text x="392" y="126" font-size="13" font-weight="600" fill="#6d28d9">bdwgc</text>

  <!-- tgc -->
  <circle cx="624" cy="161" r="9" fill="#d97706"/>
  <line x1="630" y1="168" x2="676" y2="196" stroke="#fcd34d"/>
  <text x="682" y="200" font-size="13" font-weight="600" fill="#b45309">tgc</text>
  <text x="682" y="216" font-size="11" fill="#d97706">same trade, but its allocation cost</text>
  <text x="682" y="230" font-size="11" fill="#d97706">is off this chart — hash insert per alloc</text>

  <!-- go -->
  <circle cx="221" cy="365" r="9" fill="#0891b2"/>
  <line x1="228" y1="360" x2="272" y2="336" stroke="#67e8f9"/>
  <text x="278" y="332" font-size="13" font-weight="600" fill="#0e7490">go</text>
  <text x="278" y="348" font-size="11" fill="#0891b2">concurrent mark, exact roots,</text>
  <text x="278" y="362" font-size="11" fill="#0891b2">write barrier on every store</text>

  <!-- shared annotations -->
  <rect x="140" y="404" width="234" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="150" y="420" font-size="11" fill="#6b7280">no collector here moves objects</text>

  <rect x="628" y="404" width="212" height="24" rx="4" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="638" y="420" font-size="11" fill="#6b7280">cvm's sweep runs outside its pause</text>

  <!-- callouts -->
  <text x="40" y="530" font-size="11" fill="#9ca3af">Vertical position is the cost of a pointer store: free for a stop-the-world collector, taxed for one that marks concurrently.</text>
  <text x="40" y="548" font-size="11" fill="#9ca3af">Horizontal position is how long a collection stops the program. Neither is a measurement — both are read from the collectors' code.</text>
</svg>
